[project]
name = "py-st-apply-agent-langgraph"
version = "0.1.0"
description = "An AI-powered job application agent for CV evaluation and cover letter generation."
readme = "README.md"
authors = [{ name = "Shawn" }]
requires-python = ">=3.12"
dependencies = [
    "access-modifiers>=0.3.1",
    "langchain-deepseek>=1.1.1",
    "langchain-openai>=1.7.4",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.8",
    "streamlit>=1.67.0",
    "watchdog>=7.1.0",
]
[dependency-groups]
dev = [
    "git-changelog>=2.11.0",
    "ruff>=0.17.4",
]

[tool.git-changelog]
bump = "auto"
convention = "conventional"
in-place = false
filter-commits = ""
marker-line = "<!-- insertion marker for GitHub -->"
output = "CHANGELOG.md"
parse-refs = true
parse-trailers = true
provider = "github"
repository = "."
sections = ["feat", "fix", "chore", "docs", "perf", "build", "refactor", "test", "deps"]
template = "angular"
version-regex = "^## \\[(?P<version>v?[^\\]]+)"
versioning = "semver"
zerover = false

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["D203", "D213", "E501", "SIM115"]

[tool.ruff.lint.isort]
known-first-party = ["py_ml_basic"]

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
